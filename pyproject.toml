[tool.isort]
profile = "black"
extend_skip_glob = ["app/grpc/recommendations_pb2.py", "app/grpc/recommendations_pb2.pyi", "app/grpc/recommendations_pb2_grpc.py"]

[tool.black]
extend-exclude = "app/grpc/recommendations_pb2(_grpc)?\\.py"

[tool.mypy]
exclude = ["app/grpc/recommendations_pb2.py", "app/grpc/recommendations_pb2.pyi", "app/grpc/recommendations_pb2_grpc.py"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pytest_env]
IS_LOCAL=true